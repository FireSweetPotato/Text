
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>건설현장 텍스트 마이닝 분석</title>
  <style>
    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #88A087;
    }
    header {
      background-color: #eee;
      padding: 10px 20px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #author {
      color: #333;
    }
    #gongjong-list {
      color: #333;
    }
    main {
      display: flex;
      flex-direction: row;
      background-color: #183524;
      color: white;
      height: calc(100vh - 48px);
    }
    #left {
      width: 50%;
      background: url("대표이미지.png") no-repeat center center;
      background-size: contain;
      background-color: #183524;
    }
    #right {
      width: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }
    h1 {
      font-size: 60px;
      text-align: center;
      line-height: 1.4;
    }
    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 20px;
      margin-top: 30px;
    }
    .gongjong-button {
      padding: 20px;
      font-size: 20px;
      border: none;
      background-color: #eee;
      color: #183524;
      cursor: pointer;
      border-radius: 6px;
      width: 200px;
    }
    .gongjong-button:hover {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <header>
    <div id="author">전은록 우희민 이재영</div>
    <div id="gongjong-list">철근콘크리트공사 가설공사 기계설비공사 해체및철거공사 토공사 철골공사</div>
  </header>
  <main>
    <div id="left"></div>
    <div id="right">
      <h1>텍스트 마이닝을 활용한<br>건설현장의 공종별 특성 분석</h1>
      <div class="button-grid">
        <button class="gongjong-button" onclick="location.href='gongjong_철근콘크리트공사.html'">철근콘크리트공사</button>
        <button class="gongjong-button" onclick="location.href='gongjong_가설공사.html'">가설공사</button>
        <button class="gongjong-button" onclick="location.href='gongjong_기계설비공사.html'">기계설비공사</button>
        <button class="gongjong-button" onclick="location.href='gongjong_해체및철거공사.html'">해체 및 철거공사</button>
        <button class="gongjong-button" onclick="location.href='gongjong_토공사.html'">토공사</button>
        <button class="gongjong-button" onclick="location.href='gongjong_철골공사.html'">철골공사</button>
      </div>
    </div>
  </main>
</body>
</html>
