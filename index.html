<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>건설현장 텍스트 마이닝 분석</title>
  <style>
    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #88A087; /* 배경색: 연한 초록색 */
    }
    header {
      background-color: #eee; /* 헤더 배경: 밝은 회색 */
      padding: 10px 20px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #author {
      color: #333; /* 작성자 이름 색 */
    }
    #gongjong-list {
      color: #333; /* 공종 목록 색 */
    }
    main {
      display: flex;
      flex-direction: row;
      background-color: #183524; /* 메인 배경: 어두운 초록색 */
      color: white;
      height: calc(100vh - 48px); /* 화면 높이에서 헤더 높이를 뺀 크기 */
    }
    #left {
      width: 50%; /* 왼쪽 영역: 화면의 반 */
      background: url("대표이미지.png") no-repeat center center; /* ★수정: 대표이미지.png를 배경으로 설정★ */
      background-size: contain; /* 이미지가 잘 보이도록 크기 조정 */
      background-color: #183524; /* 이미지가 없을 때 배경색 */
    }
    #right {
      width: 50%; /* 오른쪽 영역: 화면의 반 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }
    h1 {
      font-size: 60px;
      text-align: center;
      line-height: 1.4;
    }
    .start-button {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 30px;
      border: none;
      background-color: #eee; /* 버튼 배경: 밝은 회색 */
      color: #183524; /* 버튼 글자: 어두운 초록색 */
      cursor: pointer;
      border-radius: 6px;
    }
    .start-button:hover {
      background-color: #ddd; /* 버튼 hover: 조금 더 어두운 회색 */
    }
  </style>
  <!-- 필수 스크립트 추가 -->
  <script src="https://unpkg.com/graphology@0.21.1/dist/graphology.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/graphology-gexf@0.9.1/dist/graphology-gexf.min.js"></script>
  <script src="https://unpkg.com/sigma@2.3.0/build/sigma.min.js"></script>
</head>
<body>
  <header>
    <div id="author">전은록 우희민 이재영</div>
    <div id="gongjong-list">철근콘크리트공사 가설공사 기계설비공사 해체및철거공사 토공사 철골공사</div>
  </header>
  <main>
    <div id="left"></div>
    <div id="right">
      <h1>텍스트 마이닝을 활용한<br>건설현장의 공종별 특성 분석</h1>
      <button class="start-button" onclick="location.href='select.html'">GET STARTED</button>
    </div>
  </main>
</body>
</html>
