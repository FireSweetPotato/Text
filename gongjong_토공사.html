
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>토공사 시각화</title>
  <style>
    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #e8eee7;
    }
    header {
      background-color: #e8eee7;
      color: #183524;
      padding: 10px 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: left;
    }
    header img {
      height: 36px; /* 기존보다 20% 크게 */
      margin-right: 10px;
      cursor: pointer;
    }
    h1 {
      font-size: 24px;
      padding: 0px 35px;
      text-align: center;
    }
    main {
      display: flex;
      height: calc(100vh - 50px);
    }
    #sidebar {
      background-color: #183524;
      width: 250px;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    #sidebar button {
      background-color: #a3b29f;
      color: #183524;
      border: none;
      padding: 14px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
    }
    #sidebar button:hover {
      background-color: #90a590;
    }
    #content {
      flex-grow: 1;
      background-color: #e8eee7;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }
    #content img {
      max-width: 100%;
      max-height: 90%;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html"><img src="홈버튼.png" alt="홈"></a>
    <h1>토공사</h1>
  </header>
  <main>
    <div id="sidebar">
      <button onclick="location.href='gongjong_토공사_gephi.html'">Gephi</button>
      <button onclick="showViz('barchart')">막대 그래프</button>
      <button onclick="showViz('heatmap')">히트맵</button>
      <button onclick="showViz('topics')">주제 분포도</button>
      <button onclick="showViz('hierarchy')">주제 계층도</button>
      <button onclick="showViz('wordcloud')">워드클라우드</button>
    </div>
    <div id="content">
      <img id="barchart" src="★최종 분석 결과★/토공사/토공사_barchart.png" alt="막대 그래프">
      <img id="heatmap" src="★최종 분석 결과★/토공사/토공사_heatmap.png" alt="히트맵">
      <img id="topics" src="★최종 분석 결과★/토공사/토공사_topics.png" alt="주제 분포도">
      <img id="hierarchy" src="★최종 분석 결과★/토공사/토공사_hierarchy.png" alt="주제 계층도">
      <img id="wordcloud" src="★최종 분석 결과★/토공사/토공사_wordcloud.png" alt="워드클라우드">
    </div>
  </main>
  <script>
    function showViz(id) {
      if (id === 'gephi') {
        location.href = 'gongjong_토공사_gephi.html';
        return;
      }

      const all = ['barchart', 'heatmap', 'topics', 'hierarchy', 'wordcloud'];
      all.forEach(el => {
        const item = document.getElementById(el);
        item.style.display = (el === id) ? 'block' : 'none';
      });
    }

    showViz('topics');
  </script>
</body>
</html>
