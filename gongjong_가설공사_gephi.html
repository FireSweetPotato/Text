<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>가설공사 Gephi 시각화</title>
  <script src="https://unpkg.com/graphology@0.21.1/dist/graphology.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/graphology-gexf@0.9.1/dist/graphology-gexf.min.js"></script>
  <script src="https://unpkg.com/sigma@2.3.0/build/sigma.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="container"></div>
<script>
    window.addEventListener("load", () => {
      const container = document.getElementById("container");
      if (!container) {
        console.error("container not found!");
        return;
      }

      const graph = new graphology.Graph();
      graph.addNode("설치", { label: "설치", x: 0, y: 0, size: 20, color: "#c686e9" });
      graph.addNode("비계", { label: "비계", x: 1, y: 1, size: 20, color: "#c686e9" });
      graph.addEdgeWithKey("e0", "설치", "비계", { size: 1.01, color: "rgba(105,105,105,0.7)" });

      const renderer = new Sigma(graph, container);

      renderer.setSetting("defaultEdgeColor", "#999");
      renderer.setSetting("edgeColor", "default");

      let hoveredNode = null;
      renderer.on("enterNode", ({ node }) => {
        hoveredNode = node;
        renderer.setSetting("nodeReducer", (n, attr) => {
          if (n === node || graph.hasEdge(node, n) || graph.hasEdge(n, node)) return attr;
          return { ...attr, color: "#ccc", label: "" };
        });
        renderer.setSetting("edgeReducer", (e, attr) => {
          const source = graph.source(e), target = graph.target(e);
          return (source === node || target === node) ? attr : { ...attr, color: "rgba(105,105,105,0.1)" };
        });
        renderer.refresh();
      });

      renderer.on("leaveNode", () => {
        hoveredNode = null;
        if (!clickedNode) {
          renderer.setSetting("nodeReducer", null);
          renderer.setSetting("edgeReducer", null);
          renderer.refresh();
        }
      });

      let clickedNode = null;
      renderer.on("clickNode", ({ node }) => {
        clickedNode = node;
        renderer.setSetting("nodeReducer", (n, attr) => {
          if (n === node || graph.hasEdge(node, n) || graph.hasEdge(n, node)) return attr;
          return { ...attr, color: "#ccc", label: "" };
        });
        renderer.setSetting("edgeReducer", (e, attr) => {
          const source = graph.source(e), target = graph.target(e);
          return (source === node || target === node) ? attr : { ...attr, color: "rgba(105,105,105,0.1)" };
        });
        renderer.refresh();
      });

      renderer.on("clickStage", () => {
        clickedNode = null;
        renderer.setSetting("nodeReducer", null);
        renderer.setSetting("edgeReducer", null);
        renderer.refresh();
      });
    });
</script>
