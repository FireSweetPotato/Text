
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>가설공사 네트워크 시각화 (Hover & Click 강조)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/graphology/0.25.4/graphology.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/2.4.0/sigma.min.js"></script>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      #container { width: 100vw; height: 100vh; background: white; }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <script>
      const graph = new graphology.Graph();

      // 예시 노드 및 엣지 삽입
      graph.addNode("설치", { label: "설치", x: 0, y: 0, size: 10, color: "blue" });
      graph.addNode("비계", { label: "비계", x: 1, y: 1, size: 10, color: "red" });
      graph.addEdge("설치", "비계", { size: 1, color: "rgba(105,105,105,0.55)" });

      let baseEdgeOpacity = 0.55;
      let activeNode = null;
      let activeNeighbors = new Set();

      const renderer = new Sigma(graph, document.getElementById("container"), {
        labelDensity: 1,
        labelGridCellSize: 20,
        defaultNodeLabelColor: '#000',
        labelPosition: 'center',
        labelAlignment: 'center',
      });

      function setFocus(nodeId) {
        activeNode = nodeId;
        activeNeighbors = new Set();
        graph.forEachNeighbor(nodeId, (neighbor) => activeNeighbors.add(neighbor));

        renderer.setSetting("nodeReducer", (n, attrs) => {
          if (n === nodeId || activeNeighbors.has(n)) {
            return attrs;
          } else {
            return { ...attrs, label: '', color: '#ccc' };
          }
        });

        renderer.setSetting("edgeReducer", (e, attrs) => {
          const source = graph.source(e);
          const target = graph.target(e);
          if (source === nodeId || target === nodeId) {
            return { ...attrs, color: 'rgba(105,105,105,1)' };
          } else {
            return { ...attrs, color: 'rgba(200,200,200,0.1)' };
          }
        });
      }

      function clearFocus() {
        activeNode = null;
        activeNeighbors.clear();
        renderer.setSetting("nodeReducer", null);
        renderer.setSetting("edgeReducer", (e, attrs) => {
          return { ...attrs, color: `rgba(105,105,105,${baseEdgeOpacity})` };
        });
      }

      // 클릭 강조 유지
      renderer.on("clickNode", (event) => {
        setFocus(event.node);
      });

      renderer.on("clickStage", clearFocus);

      // 마우스 hover 시 일시 강조 (클릭 상태가 아닐 경우만)
      renderer.on("enterNode", (event) => {
        if (!activeNode) {
          setFocus(event.node);
        }
      });

      renderer.on("leaveNode", () => {
        if (!activeNode) {
          clearFocus();
        }
      });
    </script>
  </body>
</html>
