<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>멋진 그래프 보여주기</title>
  <!-- 그래프를 예쁘게 보여주기 위한 스타일 -->
  <style>
    #sigma-container {
      width: 100%;
      height: 600px;
      border: 1px solid black;
    }
    .controls {
      margin: 10px;
    }
  </style>
</head>
<body>
  <!-- 그래프가 그려질 공간 -->
  <div id="sigma-container"></div>
  <!-- 확대/축소 버튼과 슬라이더 -->
  <div class="controls">
    <button id="zoom-in">확대</button>
    <button id="zoom-out">축소</button>
    <button id="zoom-reset">원래 크기로</button>
    <label for="labels-threshold">이름표 조절:</label>
    <input type="range" id="labels-threshold" min="0" max="20" value="6">
  </div>

  <!-- 필요한 라이브러리 불러오기 -->
  <script src="https://unpkg.com/graphology@0.25.1/dist/graphology.umd.js"></script>
  <script src="https://unpkg.com/graphology-gexf@0.5.0/graphology-gexf.min.js"></script>
  <script src="https://unpkg.com/sigma@2.4.0/build/sigma.min.js"></script>

  <!-- 그래프를 그리는 JavaScript 코드 -->
  <script>
    // 그래프를 만들고 보여주는 코드야!
    let renderer = null;

    // "가설공사/가설공사_gexf.gexf" 파일을 가져와
    fetch("./가설공사/가설공사_gexf.gexf")
      .then((res) => res.text()) // 파일을 텍스트로 바꿔
      .then((gexf) => {
        // GEXF 텍스트를 그래프 형태로 바꿔
        const graph = GraphologyGexf.parse(Graphology.Graph, gexf);

        // HTML에서 버튼과 공간을 가져와
        const container = document.getElementById("sigma-container");
        const zoomInBtn = document.getElementById("zoom-in");
        const zoomOutBtn = document.getElementById("zoom-out");
        const zoomResetBtn = document.getElementById("zoom-reset");
        const labelsThresholdRange = document.getElementById("labels-threshold");

        // Sigma로 그래프를 화면에 그려
        renderer = new Sigma.Sigma(graph, container, {
          minCameraRatio: 0.08, // 얼마나 작게 축소할 수 있는지
          maxCameraRatio: 3, // 얼마나 크게 확대할 수 있는지
        });
        const camera = renderer.getCamera();

        // 확대 버튼: 그래프를 부드럽게 크게 보여줘
        zoomInBtn.addEventListener("click", () => {
          camera.animatedZoom({ duration: 600 });
        });

        // 축소 버튼: 그래프를 부드럽게 작게 보여줘
        zoomOutBtn.addEventListener("click", () => {
          camera.animatedUnzoom({ duration: 600 });
        });

        // 원래 크기 버튼: 처음 크기로 돌려줘
        zoomResetBtn.addEventListener("click", () => {
          camera.animatedReset({ duration: 600 });
        });

        // 슬라이더: 이름표 수를 조절해
        labelsThresholdRange.addEventListener("input", () => {
          renderer.setSetting("labelRenderedSizeThreshold", +labelsThresholdRange.value);
        });

        // 슬라이더 시작 값을 맞춰줘
        labelsThresholdRange.value = renderer.getSetting("labelRenderedSizeThreshold") + "";
      })
      .catch((error) => {
        console.error("파일을 불러오는 데 문제가 생겼어!", error);
      });

    // 그래프 지우기 함수
    function cleanup() {
      if (renderer) {
        renderer.kill();
      }
    }
  </script>
</body>
</html>
